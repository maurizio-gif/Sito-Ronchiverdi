name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild giornaliero: il sito è statico e l'elenco eventi viene calcolato
  # in fase di build, quindi senza una ricompilazione periodica un evento
  # scaduto resterebbe online fino al push successivo.
  # 03:15 UTC = 04:15 in inverno, 05:15 in estate (ora italiana).
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (self-hosted Tina + Astro)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # L'adapter @astrojs/vercel (necessario per l'endpoint /api/lead)
          # scrive l'output statico sotto dist/client/ invece che dist/.
          path: ./dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
